name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'BUILD_NUMBER'
      - 'build/release.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BUILD=$(cat BUILD_NUMBER | tr -d ' \n\r')
          VERSION=$(grep -o '"version": "[^"]*"' build/release.json | head -n1 | cut -d'"' -f4)
          [ -z "$VERSION" ] && VERSION="v1.0.0"
          TAG="${VERSION}-${BUILD}"
          TITLE="Sendmoro ${VERSION} (Build ${BUILD})"

          echo "Publishing release: ${TITLE} with tag ${TAG}"

          # Push Git tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG}"
          git push origin "${TAG}" --force

          # Create or update GitHub Release with assets
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists. Updating assets..."
            gh release edit "${TAG}" \
              --title "${TITLE}" \
              --notes "Production build ${BUILD} of Sendmoro ${VERSION}." \
              --latest
            gh release upload "${TAG}" \
              build/release.json \
              build/sendmoro-linux-amd64.tar.gz \
              build/sendmoro-installer-linux-amd64.tar.gz \
              --clobber
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes "Production build ${BUILD} of Sendmoro ${VERSION}." \
              --latest \
              build/release.json \
              build/sendmoro-linux-amd64.tar.gz \
              build/sendmoro-installer-linux-amd64.tar.gz \
              --clobber
          fi

          echo "GitHub Release ${TAG} published successfully."
